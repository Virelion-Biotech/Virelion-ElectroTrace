name: prospective-ltafdb-lead-selector-first-run

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prospective-ltafdb-lead-selector-first-run.yml'
      - 'validation_protocols/ltafdb_lead_selector_prospective_v1.json'
      - 'scripts/evaluate_ltafdb_lead_selector_prospective.py'
      - 'src/electrotrace/lead_selection.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: prospective-ltafdb-lead-selector-first-run
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install pinned prospective runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install \
            "numpy==2.1.3" \
            "pandas==2.2.3" \
            "scipy==1.16.3" \
            "scikit-learn==1.6.1" \
            "skops==0.16.0" \
            "wfdb==4.3.1"
          python -m pip install -e . --no-deps

      - name: Run prospective guardrail tests
        run: |
          pytest -q \
            tests/test_lead_selection.py \
            tests/test_ltafdb_lead_selector_prospective.py \
            tests/test_v2_gate_confidence.py

      - name: Restore trusted frozen v4 model
        run: |
          set -euo pipefail
          NAME="incart_mitbih_model_windowed_std_2026-09-09"
          PKL="/tmp/${NAME}.pkl"
          SKOPS="validation_reports/${NAME}.skops"
          EXPECTED_PKL_SHA="8732aa47051c76b043bd56e4d9dc82dc01307e0d9bcc6c5ed046fca19a27f5bb"
          HISTORICAL_COMMIT="201096a7eeb2c93f991851266903d0342b08c64b"

          git cat-file -e "${HISTORICAL_COMMIT}^{commit}"
          git show "${HISTORICAL_COMMIT}:validation_reports/${NAME}.pkl" > "${PKL}"
          echo "${EXPECTED_PKL_SHA}  ${PKL}" | sha256sum -c -

          mkdir -p validation_reports
          python scripts/convert_model_pickle_to_skops.py \
            "${PKL}" \
            "${SKOPS}" \
            --allow-pickle

          python - <<'PY'
          from pathlib import Path
          import numpy as np
          from electrotrace.candidate_suppressor import CandidateSuppressor

          name = "incart_mitbih_model_windowed_std_2026-09-09"
          legacy = CandidateSuppressor.load(Path("/tmp") / f"{name}.pkl", allow_pickle=True)
          safe = CandidateSuppressor.load(Path("validation_reports") / f"{name}.skops")
          assert legacy.metadata.to_dict() == safe.metadata.to_dict()
          assert legacy.feature_names == safe.feature_names
          rng = np.random.default_rng(20260928)
          X = rng.normal(size=(128, safe.model.n_features_in_))
          np.testing.assert_allclose(
              legacy.predict_proba(X),
              safe.predict_proba(X),
              rtol=1e-12,
              atol=1e-15,
          )
          print("Trusted frozen model reconstruction verified.")
          PY

      - name: Recover frozen v3 polarity derivation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/edb-first
          gh run download 36442894752 \
            --repo "${GITHUB_REPOSITORY}" \
            --name electrotrace-edb-prospective-first-run \
            --dir /tmp/edb-first

          DERIVE="/tmp/edb-first/2026-09-polarity-thresholds/mitdb_extended_derivation_v3.json"
          test -s "${DERIVE}"
          echo "1d9d3966e7c3ab157d5ccf69c6770ec7db7ef29ebd6a59e623c2e45fc19d3369  ${DERIVE}" | sha256sum -c -

      - name: Download complete Long-Term AF Database
        run: |
          set -euo pipefail
          mkdir -p .cache/physionet/ltafdb
          aws s3 sync --no-sign-request \
            s3://physionet-open/ltafdb/1.0.0/ \
            .cache/physionet/ltafdb/ \
            --exclude "*" \
            --include "*.hea" \
            --include "*.dat" \
            --include "*.atr" \
            --include "RECORDS"

          test -s .cache/physionet/ltafdb/RECORDS
          test "$(wc -w < .cache/physionet/ltafdb/RECORDS)" -eq 84

      - name: Run one-shot prospective LTAFDB lead-selector evaluation
        run: |
          python -u scripts/evaluate_ltafdb_lead_selector_prospective.py \
            --ltafdb-dir .cache/physionet/ltafdb \
            --model validation_reports/incart_mitbih_model_windowed_std_2026-09-09.skops \
            --polarity-threshold-report \
              /tmp/edb-first/2026-09-polarity-thresholds/mitdb_extended_derivation_v3.json \
            --confirm-first-scored-run

      - name: Hash first-run artifact
        run: |
          set -euo pipefail
          OUT="validation_reports/experiments/2026-09-ltafdb-prospective/ltafdb_lead_selector_v1_first_run.json"
          test -s "${OUT}"
          {
            echo "git_head=$(git rev-parse HEAD)"
            sha256sum "${OUT}"
          } | tee validation_reports/experiments/2026-09-ltafdb-prospective/FIRST_RUN_SHA256.txt

      - name: Upload immutable first-run result
        uses: actions/upload-artifact@v7
        with:
          name: electrotrace-ltafdb-lead-selector-first-run
          retention-days: 90
          if-no-files-found: error
          path: |
            validation_reports/experiments/2026-09-ltafdb-prospective/ltafdb_lead_selector_v1_first_run.json
            validation_reports/experiments/2026-09-ltafdb-prospective/FIRST_RUN_SHA256.txt
