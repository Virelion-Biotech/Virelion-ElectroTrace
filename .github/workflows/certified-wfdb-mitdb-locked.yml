name: certified-wfdb-mitdb-locked

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/certified-wfdb-mitdb-locked.yml'
      - 'scripts/benchmark_certified_wfdb_mitdb_locked.py'
      - 'tests/test_certified_wfdb_mitdb_locked.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/certified-wfdb-mitdb-locked.yml'
      - 'scripts/benchmark_certified_wfdb_mitdb_locked.py'
      - 'tests/test_certified_wfdb_mitdb_locked.py'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      WFDB_TOOLKIT_SOURCE_RELEASE: "10.7.0"
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Python runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install "numpy==2.1.3" "wfdb==4.3.1"

      - name: Install certified WFDB applications
        run: |
          set -euo pipefail
          WFDB_VERSION="10.7.0"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libcurl4-openssl-dev libflac-dev
          wget -q \
            "https://github.com/bemoody/wfdb/archive/refs/tags/${WFDB_VERSION}.tar.gz" \
            -O /tmp/wfdb.tar.gz
          mkdir -p /tmp/wfdb-src
          tar -xzf /tmp/wfdb.tar.gz -C /tmp/wfdb-src --strip-components=1
          cd /tmp/wfdb-src
          ./configure --prefix=/usr/local
          make -j2
          sudo make install
          sudo ldconfig
          command -v wfdb-config
          command -v gqrs
          command -v sqrs
          wfdb-config --version
          gqrs -h 2>&1 | head -40 || true
          sqrs -h 2>&1 | head -40 || true

      - name: Run benchmark guardrail tests
        run: |
          pytest -q tests/test_certified_wfdb_mitdb_locked.py

      - name: Download exact locked MIT-BIH records
        run: |
          set -euo pipefail
          OUT=".cache/physionet/mitdb"
          BASE="https://physionet.org/files/mitdb/1.0.0"
          mkdir -p "${OUT}"
          RECORDS=(105 118 122 201 207 209 214 219 230 231 232 234)
          JOBS="/tmp/mitdb-locked-downloads.tsv"
          : > "${JOBS}"
          for record in "${RECORDS[@]}"; do
            for suffix in hea dat atr; do
              printf '%s\t%s\n' "${BASE}/${record}.${suffix}" "${OUT}/${record}.${suffix}" >> "${JOBS}"
            done
          done
          xargs -P 6 -n 2 bash -c '
            set -euo pipefail
            url="$1"
            dest="$2"
            wget -q --https-only --retry-connrefused --waitretry=2 --tries=5 -O "${dest}" "${url}"
            test -s "${dest}"
          ' _ < "${JOBS}"

          test "$(find "${OUT}" -maxdepth 1 -name '*.hea' | wc -l)" -eq 12
          test "$(find "${OUT}" -maxdepth 1 -name '*.dat' | wc -l)" -eq 12
          test "$(find "${OUT}" -maxdepth 1 -name '*.atr' | wc -l)" -eq 12

      - name: Run certified reference-binary benchmark
        run: |
          python -u scripts/benchmark_certified_wfdb_mitdb_locked.py \
            --data-dir .cache/physionet/mitdb \
            --work-dir /tmp/mitdb-certified-wfdb-work \
            --output validation_reports/experiments/2026-09-mitdb-certified-wfdb/mitdb_certified_wfdb_locked.json

      - name: Hash benchmark artifact
        run: |
          set -euo pipefail
          OUT="validation_reports/experiments/2026-09-mitdb-certified-wfdb/mitdb_certified_wfdb_locked.json"
          {
            echo "git_head=$(git rev-parse HEAD)"
            sha256sum "${OUT}"
          } | tee validation_reports/experiments/2026-09-mitdb-certified-wfdb/SHA256.txt

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v7
        with:
          name: electrotrace-mitdb-certified-wfdb-locked
          retention-days: 90
          if-no-files-found: error
          path: |
            validation_reports/experiments/2026-09-mitdb-certified-wfdb/mitdb_certified_wfdb_locked.json
            validation_reports/experiments/2026-09-mitdb-certified-wfdb/SHA256.txt
