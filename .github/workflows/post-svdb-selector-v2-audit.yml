name: post-svdb-selector-v2-audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/post-svdb-selector-v2-audit.yml'
      - 'scripts/analyze_svdb_selector_v2_posthoc.py'
      - 'tests/test_svdb_selector_v2_posthoc.py'

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned audit runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install \
            "numpy==2.1.3" \
            "pandas==2.2.3" \
            "scipy==1.16.3" \
            "scikit-learn==1.6.1" \
            "skops==0.16.0" \
            "wfdb==4.3.1"
          python -m pip install -e . --no-deps

      - name: Test post-hoc audit code
        run: |
          pytest -q \
            tests/test_svdb_selector_v2_posthoc.py \
            tests/test_svdb_selector_v2_prospective.py \
            tests/test_lead_selection.py

      - name: Restore trusted frozen v4 model
        run: |
          set -euo pipefail
          NAME="incart_mitbih_model_windowed_std_2026-09-09"
          PKL="/tmp/${NAME}.pkl"
          SKOPS="validation_reports/${NAME}.skops"
          EXPECTED_PKL_SHA="8732aa47051c76b043bd56e4d9dc82dc01307e0d9bcc6c5ed046fca19a27f5bb"
          HISTORICAL_COMMIT="201096a7eeb2c93f991851266903d0342b08c64b"
          git cat-file -e "${HISTORICAL_COMMIT}^{commit}"
          git show "${HISTORICAL_COMMIT}:validation_reports/${NAME}.pkl" > "${PKL}"
          echo "${EXPECTED_PKL_SHA}  ${PKL}" | sha256sum -c -
          mkdir -p validation_reports
          python scripts/convert_model_pickle_to_skops.py "${PKL}" "${SKOPS}" --allow-pickle

      - name: Recover immutable prospective artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/edb-first /tmp/svdb-first
          gh run download 36442894752 \
            --repo "${GITHUB_REPOSITORY}" \
            --name electrotrace-edb-prospective-first-run \
            --dir /tmp/edb-first
          gh run download 36501118072 \
            --repo "${GITHUB_REPOSITORY}" \
            --name electrotrace-svdb-selector-v2-first-run \
            --dir /tmp/svdb-first

          DERIVE="/tmp/edb-first/2026-09-polarity-thresholds/mitdb_extended_derivation_v3.json"
          FIRST="/tmp/svdb-first/svdb_selector_v2_first_run.json"
          test -s "${DERIVE}"
          test -s "${FIRST}"
          echo "1d9d3966e7c3ab157d5ccf69c6770ec7db7ef29ebd6a59e623c2e45fc19d3369  ${DERIVE}" | sha256sum -c -
          echo "6e02fe1c2591fb2789e82eaac5bd5087e52a7f477bba20d5ad94fc63b6dd916f  ${FIRST}" | sha256sum -c -

      - name: Download exposed SVDB
        run: |
          set -euo pipefail
          mkdir -p .cache/physionet/svdb
          aws s3 sync --no-sign-request \
            s3://physionet-open/svdb/1.0.0/ \
            .cache/physionet/svdb/ \
            --exclude "*" \
            --include "*.hea" \
            --include "*.dat" \
            --include "*.atr" \
            --include "RECORDS"
          test -s .cache/physionet/svdb/RECORDS
          test "$(wc -w < .cache/physionet/svdb/RECORDS)" -eq 78

      - name: Run exposed comparator audit
        run: |
          python -u scripts/analyze_svdb_selector_v2_posthoc.py \
            --svdb-dir .cache/physionet/svdb \
            --model validation_reports/incart_mitbih_model_windowed_std_2026-09-09.skops \
            --polarity-threshold-report \
              /tmp/edb-first/2026-09-polarity-thresholds/mitdb_extended_derivation_v3.json \
            --first-run-report \
              /tmp/svdb-first/svdb_selector_v2_first_run.json \
            --output \
              validation_reports/experiments/2026-09-svdb-posthoc/svdb_selector_posthoc_audit.json

      - name: Hash post-hoc artifact
        run: |
          set -euo pipefail
          OUT="validation_reports/experiments/2026-09-svdb-posthoc/svdb_selector_posthoc_audit.json"
          {
            echo "git_head=$(git rev-parse HEAD)"
            sha256sum "${OUT}"
          } | tee validation_reports/experiments/2026-09-svdb-posthoc/POSTHOC_SHA256.txt

      - name: Upload post-hoc comparator artifact
        uses: actions/upload-artifact@v4
        with:
          name: electrotrace-svdb-selector-posthoc-audit
          retention-days: 90
          if-no-files-found: error
          path: |
            validation_reports/experiments/2026-09-svdb-posthoc/svdb_selector_posthoc_audit.json
            validation_reports/experiments/2026-09-svdb-posthoc/POSTHOC_SHA256.txt
