name: incart-frozen-v4-complete-characterization

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/incart-frozen-v4-complete-characterization.yml'
      - 'scripts/evaluate_frozen_model_incart_complete.py'
      - 'scripts/benchmark_certified_wfdb_incart.py'
      - 'src/electrotrace/wfdb_records.py'
      - 'tests/test_incart_complete_characterization.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/incart-frozen-v4-complete-characterization.yml'
      - 'scripts/evaluate_frozen_model_incart_complete.py'
      - 'scripts/benchmark_certified_wfdb_incart.py'
      - 'src/electrotrace/wfdb_records.py'
      - 'tests/test_incart_complete_characterization.py'

permissions:
  contents: read
  actions: read

jobs:
  characterize:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      WFDB_TOOLKIT_SOURCE_RELEASE: "10.7.0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned Python runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,dev]"
          python -m pip install \
            "numpy==2.1.3" \
            "pandas==2.2.3" \
            "scipy==1.16.3" \
            "scikit-learn==1.6.1" \
            "skops==0.16.0" \
            "wfdb==4.3.1"
          python -m pip install -e . --no-deps

      - name: Install pinned certified WFDB applications
        run: |
          set -euo pipefail
          WFDB_VERSION="${WFDB_TOOLKIT_SOURCE_RELEASE}"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libcurl4-openssl-dev libflac-dev
          wget -q \
            "https://github.com/bemoody/wfdb/archive/refs/tags/${WFDB_VERSION}.tar.gz" \
            -O /tmp/wfdb.tar.gz
          mkdir -p /tmp/wfdb-src
          tar -xzf /tmp/wfdb.tar.gz -C /tmp/wfdb-src --strip-components=1
          cd /tmp/wfdb-src
          ./configure --prefix=/usr/local
          make -j2
          sudo make install
          sudo ldconfig
          command -v gqrs
          command -v sqrs

      - name: Test final INCART guardrails
        run: |
          pytest -q \
            tests/test_incart_complete_characterization.py \
            tests/test_certified_wfdb_mitdb_locked.py
          ruff check \
            scripts/evaluate_frozen_model_incart_complete.py \
            tests/test_incart_complete_characterization.py

      - name: Restore trusted frozen v4 model
        run: |
          set -euo pipefail
          NAME="incart_mitbih_model_windowed_std_2026-09-09"
          PKL="/tmp/${NAME}.pkl"
          SKOPS="validation_reports/${NAME}.skops"
          EXPECTED_PKL_SHA="8732aa47051c76b043bd56e4d9dc82dc01307e0d9bcc6c5ed046fca19a27f5bb"
          HISTORICAL_COMMIT="201096a7eeb2c93f991851266903d0342b08c64b"
          git cat-file -e "${HISTORICAL_COMMIT}^{commit}"
          git show "${HISTORICAL_COMMIT}:validation_reports/${NAME}.pkl" > "${PKL}"
          echo "${EXPECTED_PKL_SHA}  ${PKL}" | sha256sum -c -
          python scripts/convert_model_pickle_to_skops.py "${PKL}" "${SKOPS}" --allow-pickle

      - name: Recover frozen polarity derivation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/edb-first
          gh run download 36442894752 \
            --repo "${GITHUB_REPOSITORY}" \
            --name electrotrace-edb-prospective-first-run \
            --dir /tmp/edb-first
          DERIVE="/tmp/edb-first/2026-09-polarity-thresholds/mitdb_extended_derivation_v3.json"
          test -s "${DERIVE}"
          echo "1d9d3966e7c3ab157d5ccf69c6770ec7db7ef29ebd6a59e623c2e45fc19d3369  ${DERIVE}" | sha256sum -c -

      - name: Download exact 75-record INCART release
        run: |
          set -euo pipefail
          OUT=".cache/physionet/incartdb"
          BASE="https://physionet.org/files/incartdb/1.0.0"
          mkdir -p "${OUT}"
          wget -q --https-only -O "${OUT}/RECORDS" "${BASE}/RECORDS"

          JOBS="/tmp/incart-downloads.tsv"
          : > "${JOBS}"
          for i in $(seq -w 1 75); do
            record="I${i}"
            for suffix in hea dat atr; do
              printf '%s\t%s\n' "${BASE}/${record}.${suffix}" "${OUT}/${record}.${suffix}" >> "${JOBS}"
            done
          done

          xargs -P 12 -n 2 bash -c '
            set -euo pipefail
            url="$1"
            dest="$2"
            wget -q --https-only --retry-connrefused --waitretry=2 --tries=5 \
              -O "${dest}" "${url}"
            test -s "${dest}"
          ' _ < "${JOBS}"

          test "$(find "${OUT}" -maxdepth 1 -name 'I*.hea' | wc -l)" -eq 75
          test "$(find "${OUT}" -maxdepth 1 -name 'I*.dat' | wc -l)" -eq 75
          test "$(find "${OUT}" -maxdepth 1 -name 'I*.atr' | wc -l)" -eq 75

      - name: Run certified WFDB reference-integrity and baseline audit
        run: |
          python -u scripts/benchmark_certified_wfdb_incart.py \
            --data-dir .cache/physionet/incartdb \
            --work-dir /tmp/incart-certified-wfdb \
            --output validation_reports/experiments/2026-09-incart-complete/incart_certified_wfdb_complete.json \
            --annotation-policy drop_edges \
            --detectors gqrs,sqrs

      - name: Run frozen-v4 complete INCART characterization
        run: |
          python -u scripts/evaluate_frozen_model_incart_complete.py \
            --incart-dir .cache/physionet/incartdb \
            --model validation_reports/incart_mitbih_model_windowed_std_2026-09-09.skops \
            --polarity-threshold-report \
              /tmp/edb-first/2026-09-polarity-thresholds/mitdb_extended_derivation_v3.json \
            --certified-reference-audit \
              validation_reports/experiments/2026-09-incart-complete/incart_certified_wfdb_complete.json \
            --certified-work-dir /tmp/incart-certified-wfdb \
            --output \
              validation_reports/experiments/2026-09-incart-complete/incart_frozen_v4_complete_characterization.json \
            --bootstrap 2000 \
            --seed 42

      - name: Hash completed artifacts
        run: |
          set -euo pipefail
          DIR="validation_reports/experiments/2026-09-incart-complete"
          {
            echo "git_head=$(git rev-parse HEAD)"
            echo "wfdb_toolkit_source_release=${WFDB_TOOLKIT_SOURCE_RELEASE}"
            sha256sum "${DIR}/incart_certified_wfdb_complete.json"
            sha256sum "${DIR}/incart_frozen_v4_complete_characterization.json"
          } | tee "${DIR}/SHA256.txt"

      - name: Upload complete INCART characterization
        uses: actions/upload-artifact@v4
        with:
          name: electrotrace-incart-frozen-v4-complete-characterization
          retention-days: 90
          if-no-files-found: error
          path: |
            validation_reports/experiments/2026-09-incart-complete/incart_certified_wfdb_complete.json
            validation_reports/experiments/2026-09-incart-complete/incart_frozen_v4_complete_characterization.json
            validation_reports/experiments/2026-09-incart-complete/SHA256.txt
