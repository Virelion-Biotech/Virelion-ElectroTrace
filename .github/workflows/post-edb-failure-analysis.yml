name: post-edb-failure-analysis

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/post-edb-failure-analysis.yml'

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned diagnostic runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install             "numpy==2.1.3"             "pandas==2.2.3"             "scipy==1.16.3"             "scikit-learn==1.6.1"             "skops==0.16.0"             "wfdb==4.3.1"
          python -m pip install -e . --no-deps

      - name: Test post-hoc diagnostic code
        run: |
          pytest -q tests/test_edb_posthoc_failures.py tests/test_fp_analysis.py

      - name: Restore trusted frozen v4 model
        run: |
          set -euo pipefail
          NAME="incart_mitbih_model_windowed_std_2026-09-09"
          PKL="/tmp/${NAME}.pkl"
          SKOPS="validation_reports/${NAME}.skops"
          EXPECTED_PKL_SHA="8732aa47051c76b043bd56e4d9dc82dc01307e0d9bcc6c5ed046fca19a27f5bb"
          HISTORICAL_COMMIT="201096a7eeb2c93f991851266903d0342b08c64b"

          git cat-file -e "${HISTORICAL_COMMIT}^{commit}"
          git show "${HISTORICAL_COMMIT}:validation_reports/${NAME}.pkl" > "${PKL}"
          echo "${EXPECTED_PKL_SHA}  ${PKL}" | sha256sum -c -

          mkdir -p validation_reports
          python scripts/convert_model_pickle_to_skops.py             "${PKL}"             "${SKOPS}"             --allow-pickle

      - name: Recover immutable prospective first-run inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/edb-first
          gh run download 36442894752             --repo "${GITHUB_REPOSITORY}"             --name electrotrace-edb-prospective-first-run             --dir /tmp/edb-first

          test -s /tmp/edb-first/2026-09-edb-prospective/edb_frozen_v4_prospective_first_run.json
          test -s /tmp/edb-first/2026-09-polarity-thresholds/mitdb_extended_derivation_v3.json

          echo "fc9a3cb0833bce7ad15ba32098ebd328835eb72f133cb73550e6f6a1057aa491  /tmp/edb-first/2026-09-edb-prospective/edb_frozen_v4_prospective_first_run.json" | sha256sum -c -
          echo "1d9d3966e7c3ab157d5ccf69c6770ec7db7ef29ebd6a59e623c2e45fc19d3369  /tmp/edb-first/2026-09-polarity-thresholds/mitdb_extended_derivation_v3.json" | sha256sum -c -

      - name: Download exposed European ST-T development data
        run: |
          set -euo pipefail
          mkdir -p .cache/physionet/edb
          aws s3 sync --no-sign-request             s3://physionet-open/edb/1.0.0/             .cache/physionet/edb/             --exclude "*"             --include "*.hea"             --include "*.dat"             --include "*.atr"             --include "RECORDS"
          test -s .cache/physionet/edb/RECORDS
          test "$(wc -l < .cache/physionet/edb/RECORDS)" -eq 90

      - name: Run exposed-data failure analysis
        run: |
          python -u scripts/analyze_edb_posthoc_failures.py             --edb-dir .cache/physionet/edb             --model validation_reports/incart_mitbih_model_windowed_std_2026-09-09.skops             --first-run-report               /tmp/edb-first/2026-09-edb-prospective/edb_frozen_v4_prospective_first_run.json             --polarity-threshold-report               /tmp/edb-first/2026-09-polarity-thresholds/mitdb_extended_derivation_v3.json             --output-json               validation_reports/experiments/2026-09-edb-posthoc/edb_low_tail_failure_analysis.json             --output-csv               validation_reports/experiments/2026-09-edb-posthoc/edb_low_tail_failure_table.csv             --f1-cutoff 0.80

      - name: Hash diagnostic outputs
        run: |
          set -euo pipefail
          {
            echo "git_head=$(git rev-parse HEAD)"
            sha256sum               validation_reports/experiments/2026-09-edb-posthoc/edb_low_tail_failure_analysis.json               validation_reports/experiments/2026-09-edb-posthoc/edb_low_tail_failure_table.csv
          } | tee validation_reports/experiments/2026-09-edb-posthoc/POSTHOC_SHA256.txt

      - name: Upload post-hoc analysis
        uses: actions/upload-artifact@v4
        with:
          name: electrotrace-edb-posthoc-failure-analysis
          retention-days: 90
          if-no-files-found: error
          path: |
            validation_reports/experiments/2026-09-edb-posthoc/edb_low_tail_failure_analysis.json
            validation_reports/experiments/2026-09-edb-posthoc/edb_low_tail_failure_table.csv
            validation_reports/experiments/2026-09-edb-posthoc/POSTHOC_SHA256.txt
