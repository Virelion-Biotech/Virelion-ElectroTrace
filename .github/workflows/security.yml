name: security

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]" pip-audit bandit
      - run: pip-audit
      - run: bandit -q -r server.py src -x tests,candidate_suppressor.py
      # CandidateSuppressor deliberately loads trusted local model artifacts with pickle.
      # Keep all other Bandit checks enabled for this file.
      - run: bandit -q src/electrotrace/candidate_suppressor.py -s B403,B301
