name: security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]" pip-audit bandit
      - run: pip-audit
      - run: bandit -q -r server.py src tests scripts -x candidate_suppressor.py
      # The remaining legacy-pickle migration path is deliberately isolated and
      # requires an explicit allow_pickle=True opt-in.
      - run: bandit -q src/electrotrace/candidate_suppressor.py -s B301
