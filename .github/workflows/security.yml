name: security

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]" pip-audit bandit
      - run: pip-audit
      - run: bandit -q -r server.py src -x candidate_suppressor.py
      # Legacy pickle loading is isolated and requires explicit local opt-in.
      - run: bandit -q src/electrotrace/candidate_suppressor.py -s B301
