name: release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.meta.outputs.should_release }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      target_sha: ${{ steps.meta.outputs.target_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: meta
        name: Resolve release metadata
        shell: bash
        run: |
          set -euo pipefail

          tag=""
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            subject="$(git log -1 --pretty=%s)"
            if [[ "${subject}" =~ ^release:\ v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              tag="v${BASH_REMATCH[1]}"
            else
              echo "should_release=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          else
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          version="${tag#v}"
          package_version="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as handle:
              print(tomllib.load(handle)["project"]["version"])
          PY
          )"
          if [[ "${version}" != "${package_version}" ]]; then
            echo "Release version ${version} does not match package version ${package_version}" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" != "tag" ]] && git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists; branch-triggered release is already complete."
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "should_release=true" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "target_sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test,dev]"
      - run: pytest -q
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: electrotrace-dist
          path: dist/*

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: electrotrace-dist
          path: dist
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-release:
    needs: [prepare, publish]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: electrotrace-dist
          path: dist
      - name: Extract curated release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          start = next(
              (i for i, line in enumerate(lines) if line == f"## {version}" or line.startswith(f"## {version} ")),
              None,
          )
          if start is None:
              raise SystemExit(f"No CHANGELOG section found for {version}")
          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("## ")), len(lines))
          notes = "\n".join(lines[start + 1 : end]).strip()
          if not notes:
              raise SystemExit(f"CHANGELOG section for {version} is empty")
          Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
            gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --title "${TAG}" --notes-file release-notes.md
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            gh release create "${TAG}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${TAG}" \
              --notes-file release-notes.md \
              --verify-tag
          else
            gh release create "${TAG}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${TAG}" \
              --notes-file release-notes.md \
              --target "${TARGET_SHA}"
          fi
