version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:30"
      timezone: "Asia/Riyadh"
    open-pull-requests-limit: 2
    labels:
      - dependencies
    groups:
      nonbreaking-python:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
 
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Riyadh"
    open-pull-requests-limit: 2
    labels:
      - dependencies
    groups:
      nonbreaking-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:30"
      timezone: "Asia/Riyadh"
    open-pull-requests-limit: 2
    labels:
      - dependencies
    groups:
      nonbreaking-docker:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
