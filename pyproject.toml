[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "electrotrace"
version = "1.5.1"
description = "Research-oriented ECG and electrophysiology annotation, segmentation, phenotyping, and leakage-safe ML toolkit"
requires-python = ">=3.10"
dependencies = [
  "flask>=3.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.4",
  "wfdb>=4.1",
  "pyedflib>=0.1.38",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
