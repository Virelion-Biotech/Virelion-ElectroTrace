[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "electrotrace"
version = "1.8.1"
description = "Reproducible ECG/electrophysiology annotation, benchmarking, phenotyping, and leakage-safe validation toolkit"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
wfdb = ["wfdb>=4.1"]
edf = ["pyedflib>=0.1.38"]
server = ["flask>=3.0"]
models = ["skops>=0.14"]
all = [
  "wfdb>=4.1",
  "pyedflib>=0.1.38",
  "flask>=3.0",
  "skops>=0.14",
]
test = [
  "pytest>=8.0",
  "wfdb>=4.1",
  "pyedflib>=0.1.38",
  "skops>=0.14",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "build>=1.2",
  "mypy>=1.11",
  "wfdb>=4.1",
  "pyedflib>=0.1.38",
  "flask>=3.0",
  "skops>=0.14",
]

[project.scripts]
electrotrace = "electrotrace.cli:main"
electrotrace-hearttwin = "electrotrace.hearttwin_adapter:main"

[project.entry-points."electrotrace.detectors"]
# Third-party detector packages register callables here.

[project.urls]
Homepage = "https://github.com/Virelion-Biotech/Virelion-ElectroTrace"
Documentation = "https://github.com/Virelion-Biotech/Virelion-ElectroTrace/tree/main/docs"
Repository = "https://github.com/Virelion-Biotech/Virelion-ElectroTrace"
Issues = "https://github.com/Virelion-Biotech/Virelion-ElectroTrace/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["electrotrace", "scripts"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
